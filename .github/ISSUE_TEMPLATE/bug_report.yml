name: Bug report
description: Report a reproducible problem in Nova Tweaks
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nova Tweaks. Remove secrets and personal information from logs and screenshots before attaching them.

  - type: input
    id: version
    attributes:
      label: Nova Tweaks version
      description: Use the version shown in Settings or the exact commit for a development build.
      placeholder: "1.0.1 Preview"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include edition and build number when available.
      placeholder: "Windows 11 Pro, 24H2, build 26100"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - Other or unknown
    validations:
      required: true

  - type: input
    id: feature
    attributes:
      label: Affected feature
      placeholder: "Tweaks, Advanced Sensors, Backup and Restore, Apps, Automation, Game Mode, Settings"

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: Describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste a short relevant excerpt or attach a redacted log file. Do not include secrets or personal data.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach redacted screenshots if they make the issue easier to understand.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant hardware, drivers, permissions, or recent Windows changes.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      options:
        - label: I tested the current release or identified the exact affected version.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed confidential and personal data from logs and screenshots.
          required: true
        - label: I can reproduce this issue consistently, where applicable.
          required: false
