name: Validate Windows source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        profile: [local, store-candidate]
    env:
      NOVA_BUILD_PROFILE: ${{ matrix.profile }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Check interface types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Package unsigned application
        run: node scripts/package-windows.js ${{ matrix.profile }} --dir
