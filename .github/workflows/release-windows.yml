name: Build Windows release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --test-concurrency=2
      - name: Build candidate without the local unsigned broker bypass
        run: npm run dist:candidate
      - name: Validate candidate provenance and checksum
        env:
          NOVA_RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/validate-release.js .cache/packaging/candidate candidate
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate-${{ github.sha }}
          path: .cache/packaging/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Signing remains a separate protected operation
        shell: pwsh
        run: |
          'Candidate only. No Stable release was published.' >> $env:GITHUB_STEP_SUMMARY
          'Certum/SimplySign signing requires the protected nova-signing Windows runner and a maintainer-approved dispatch of publish-signed-windows.yml.' >> $env:GITHUB_STEP_SUMMARY
