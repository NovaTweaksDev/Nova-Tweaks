name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }

      - name: Run tests
        run: npm test

      - name: Build unsigned installer
        run: npm run dist:local

      - name: Validate release files
        id: artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist-release -Filter 'NovaTweaks-Setup-*-x64.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          Get-Item -LiteralPath dist-release/checksums.txt -ErrorAction Stop | Out-Null
          "installer=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.artifacts.outputs.installer }}
        run: |
          @'
          Nova Tweaks 1.0.2 improves Game Mode reliability:

          - Active Game Mode clicks now report that the preset is being disabled.
          - Activation consistently executes all seven configured actions.
          - Deactivation validates and restores the saved pre-activation state.
          - Concurrent execution and incomplete restore snapshots are handled safely.

          Automated tests and the production Windows build passed before publication.

          This installer is unsigned. Windows may show an unknown-publisher warning.
          Verify the installer against the included checksums.txt file before running it.
          '@ | Set-Content -LiteralPath release-notes.md

          gh release create $env:GITHUB_REF_NAME `
            $env:INSTALLER_PATH `
            dist-release/checksums.txt `
            --verify-tag `
            --title "Nova Tweaks $env:GITHUB_REF_NAME" `
            --notes-file release-notes.md
