name: Publish unsigned Windows preview

on:
  push:
    tags: ['preview-v*']

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate preview tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "preview-v$version") { throw 'Preview tag and package version differ.' }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:preview
      - name: Verify final preview and generate accurate notes
        env:
          NOVA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/validate-release.js .cache/packaging/preview preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview validation failed.' }
          node scripts/release-notes.js .cache/packaging/preview preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview notes validation failed.' }
      - name: Publish preview only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create $env:GITHUB_REF_NAME ".cache/packaging/preview/NovaTweaks-preview-Setup-$version-x64.exe" .cache/packaging/preview/checksums.txt --verify-tag --prerelease --title "Nova Tweaks $version — Unsigned Preview" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Preview publication failed.' }
